<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京 家系ラーメン検索アプリ CSV強化版</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px;background:linear-gradient(135deg,#7f1d1d,#ea580c);text-align:center}
.wrap{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:390px 1fr;gap:16px}
.panel{background:#1f2937;border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.12)}
label{display:block;margin:10px 0 6px;font-weight:800}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#111827;color:#fff}
textarea{min-height:210px;font-family:Consolas,monospace;white-space:pre;overflow:auto}
button{border:0;border-radius:12px;padding:11px 14px;background:#f97316;color:#fff;font-weight:800;cursor:pointer}
button.secondary{background:#374151}
button.danger{background:#dc2626}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#map{height:620px;border-radius:18px;background:#374151}
.small{font-size:13px;color:#d1d5db;line-height:1.6}
.results{display:grid;gap:10px;max-height:560px;overflow:auto;margin-top:12px}
.shop{background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
.shop h3{margin:0 0 6px;color:#fed7aa;font-size:16px}
.shop p{margin:4px 0;color:#d1d5db;font-size:14px}
.tag{display:inline-block;background:#374151;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}
#dataBox{display:none}
.err{background:#3f1d1d;color:#fecaca;border:1px solid #7f1d1d;padding:10px;border-radius:12px;white-space:pre-wrap}
.ok{background:#063b2c;color:#bbf7d0;border:1px solid #16a34a;padding:10px;border-radius:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}#map{height:430px}}
</style>
</head>
<body>
<header>
<h1>東京 家系ラーメン検索アプリ</h1>
<p>CSVエラーで止まらない強化版</p>
</header>

<main class="wrap">
<div class="grid">
<section class="panel">
<label>エリア</label>
<select id="areaMode"></select>

<label>キーワード</label>
<input id="keyword" placeholder="店名・住所・タグで検索">

<div class="btns">
<button onclick="applySearch()">検索</button>
<button class="secondary" onclick="showData()">CSV貼り付け</button>
<button class="secondary" onclick="showResults()">検索結果</button>
<button class="danger" onclick="resetStores()">初期化</button>
</div>

<p id="status" class="small"></p>
<div id="message"></div>

<div id="resultsBox" class="results"></div>

<div id="dataBox">
<p class="small">
対応CSV：<br>
① id,name,area,address,lat,lng,tags<br>
② id,name,type,area,cityArea,address,lat,lng,rating,tags,memo<br>
③ id,name,type,area,cityArea,address,lat,lng でもOK
</p>
<label>CSV貼り付け</label>
<textarea id="csvInput"></textarea>
<div class="btns">
<button onclick="applyCsv()">CSVを反映</button>
<button class="secondary" onclick="exportCsv()">現在データをCSV欄へ</button>
</div>

<label>JSON確認</label>
<textarea id="jsonBox"></textarea>
</div>
</section>

<section class="panel">
<div id="map"></div>
<p class="small">※来店前に住所・営業時間を確認してください。</p>
</section>
</div>
</main>

<script>
const STORAGE_KEY = "iekei_csv_tolerant_v1";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ99X3PZgshX8UHUQ0QbcOhDCXsvawQ9LtaI9_StRyMI8_kpUDWLzXldEef668bTquw9Kh5AQD7_Ssh/pub?output=csv";
const DEFAULT_STORES = [
  {
    "id": "sample_shibuya_001",
    "name": "横浜家系らーめん 侍 渋谷本店",
    "type": "その他",
    "area": "tokyo",
    "cityArea": "渋谷",
    "address": "東京都渋谷区道玄坂2-6-6",
    "lat": 35.6587,
    "lng": 139.6994,
    "rating": 5,
    "tags": [
      "渋谷",
      "濃厚",
      "人気"
    ],
    "memo": "初期サンプル"
  }
];
let stores = [];
let filteredStores = [];
let map;
let markers = [];

async function init(){
  stores = await loadStoresFromCsvUrl();
  map = L.map("map").setView([35.681236,139.767125], 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }).addTo(map);

  document.getElementById("areaMode").addEventListener("change", applySearch);
  document.getElementById("keyword").addEventListener("input", applySearch);
  exportCsv();
  buildAreas();
  applySearch();
}

function loadStores(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  } catch(e) {}
  return DEFAULT_STORES;
}
async function loadStoresFromCsvUrl(){
  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();

    const lines = cleanText(text)
      .split(/\r?\n/)
      .map(x => cleanText(x))
      .filter(Boolean);

    const header = parseCsvLine(lines.shift()).map(h => cleanText(h).toLowerCase());

    const data = [];

    lines.forEach((line) => {
      const vals = parseCsvLine(line);
      const row = {};
      header.forEach((h,i) => row[h] = vals[i] ?? "");

      const obj = {
        id: row.id,
        name: row.name,
        type: row.type || "その他",
        area: "tokyo",
        cityArea: row.cityarea || row.area || "",
        address: row.address,
        lat: Number(row.lat),
        lng: Number(row.lng),
        rating: Number(row.rating || 4),
        tags: String(row.tags || "").split("|").map(cleanText).filter(Boolean),
        memo: row.memo || "スプレッドシート読込"
      };

      if(!obj.cityArea || obj.cityArea === "tokyo"){
        obj.cityArea = inferArea([obj.name,obj.address,obj.tags.join("|")].join(" "));
      }

      if(!obj.tags.includes(obj.cityArea)) obj.tags.unshift(obj.cityArea);

      if(validStore(obj)) data.push(obj);
    });

    if(data.length) return data;

  } catch(e) {
    console.error("CSV読み込み失敗", e);
  }

  return loadStores();
}
function saveStores(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stores));
}

function cleanText(s){
  return String(s ?? "")
    .replace(/^\uFEFF/, "")
    .replace(/\uFEFF/g, "")
    .replace(/[“”]/g, '"')
    .replace(/[，]/g, ",")
    .trim();
}

function parseCsvLine(line){
  const out = [];
  let cur = "";
  let q = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"' && line[i+1] === '"'){cur += '"'; i++;}
    else if(ch === '"') q = !q;
    else if(ch === "," && !q){out.push(cleanText(cur)); cur = "";}
    else cur += ch;
  }
  out.push(cleanText(cur));
  return out;
}

function isNum(v){
  return Number.isFinite(Number(v));
}

function validStore(s){
  return s.id && s.name && isNum(s.lat) && isNum(s.lng);
}

function inferArea(text){
  const t = String(text || "");
  const rules = [
    ["新宿",["新宿","西新宿","歌舞伎町","高田馬場","早稲田"]],
    ["渋谷",["渋谷","道玄坂","宇田川町","宮益坂"]],
    ["池袋",["池袋","東池袋","南池袋","西池袋"]],
    ["中野",["中野","新中野","中野坂上","東中野"]],
    ["高円寺",["高円寺","新高円寺"]],
    ["阿佐ヶ谷",["阿佐ヶ谷","阿佐谷"]],
    ["荻窪",["荻窪"]],
    ["西荻窪",["西荻窪","西荻"]],
    ["吉祥寺",["吉祥寺","井の頭","井之頭"]],
    ["三鷹",["三鷹","三鷹台"]],
    ["下北沢",["下北沢"]],
    ["笹塚",["笹塚"]],
    ["初台",["初台","幡ヶ谷"]],
    ["三軒茶屋",["三軒茶屋"]],
    ["用賀",["用賀"]],
    ["成城学園前",["成城学園前","成城"]],
    ["狛江",["狛江","喜多見"]],
    ["神田",["神田","秋葉原","神保町","水道橋"]],
    ["上野",["上野","御徒町","湯島","鶯谷"]],
    ["新橋",["新橋"]],
    ["銀座",["銀座","有楽町","築地"]],
    ["浜松町",["浜松町","大門","芝公園","田町","三田"]],
    ["五反田",["五反田"]],
    ["両国",["両国","錦糸町","蔵前","浅草橋"]],
    ["立川",["立川","西国立"]],
    ["国立",["国立"]],
    ["武蔵小金井",["武蔵小金井","東小金井"]],
    ["西国分寺",["西国分寺","国分寺"]],
    ["小平",["小平","花小金井"]]
  ];
  for(const [area, words] of rules){
    if(words.some(w => t.includes(w))) return area;
  }
  return "その他";
}

function applyCsv(){
  const msg = document.getElementById("message");
  msg.innerHTML = "";
  const raw = document.getElementById("csvInput").value;
  const text = cleanText(raw);
  if(!text){
    msg.innerHTML = '<div class="err">CSVが空です。</div>';
    return;
  }

  const lines = text.split(/\r?\n/).map(x => cleanText(x)).filter(Boolean);
  const headerRaw = parseCsvLine(lines.shift()).map(h => cleanText(h));
  const header = headerRaw.map(h => h.toLowerCase());

  const data = [];
  const skipped = [];

  lines.forEach((line, index) => {
    const vals = parseCsvLine(line);
    let obj = null;

    // ヘッダーあり処理
    const row = {};
    header.forEach((h,i) => row[h] = vals[i] ?? "");

    if(header.includes("id") && header.includes("name")){
      obj = {
        id: row.id,
        name: row.name,
        type: row.type || "その他",
        area: "tokyo",
        cityArea: row.cityarea || row.area || "",
        address: row.address,
        lat: Number(row.lat),
        lng: Number(row.lng),
        rating: Number(row.rating || 4),
        tags: String(row.tags || "").split("|").map(cleanText).filter(Boolean),
        memo: row.memo || "CSV追加"
      };
    }

    // 念のため7列固定の順番でも読む
    if(!obj || !validStore(obj)){
      if(vals.length >= 7){
        obj = {
          id: vals[0],
          name: vals[1],
          type: "その他",
          area: "tokyo",
          cityArea: vals[2],
          address: vals[3],
          lat: Number(vals[4]),
          lng: Number(vals[5]),
          rating: 4,
          tags: String(vals.slice(6).join("|")).split("|").map(cleanText).filter(Boolean),
          memo: "CSV追加"
        };
      }
    }

    // 8列・11列でも読む
    if(!obj || !validStore(obj)){
      if(vals.length >= 8){
        obj = {
          id: vals[0],
          name: vals[1],
          type: vals[2] || "その他",
          area: "tokyo",
          cityArea: vals[4] || vals[3],
          address: vals[5],
          lat: Number(vals[6]),
          lng: Number(vals[7]),
          rating: Number(vals[8] || 4),
          tags: String(vals[9] || "").split("|").map(cleanText).filter(Boolean),
          memo: vals[10] || "CSV追加"
        };
      }
    }

    if(obj){
      if(!obj.cityArea || obj.cityArea === "tokyo") {
        obj.cityArea = inferArea([obj.name,obj.address,obj.tags.join("|"),obj.memo].join(" "));
      }
      if(!obj.tags.includes(obj.cityArea)) obj.tags.unshift(obj.cityArea);
    }

    if(obj && validStore(obj)){
      data.push(obj);
    } else {
      skipped.push((index + 2) + "行目: " + line);
    }
  });

  if(!data.length){
    msg.innerHTML = '<div class="err">読み込める行がありません。CSVのヘッダーとlat/lngを確認してください。</div>';
    return;
  }

  stores = data;
  saveStores();
  exportCsv();
  buildAreas();
  document.getElementById("areaMode").value = "all";
  applySearch();

  msg.innerHTML = '<div class="ok">' + data.length + '件読み込みました。' + (skipped.length ? '<br>スキップ: ' + skipped.length + '件' : '') + '</div>' +
    (skipped.length ? '<div class="err">' + skipped.slice(0,10).join("\n") + '</div>' : '');
}

function buildAreas(){
  const select = document.getElementById("areaMode");
  const current = select.value || "all";
  const areas = [...new Set(stores.map(s => s.cityArea || "その他"))].sort((a,b)=>a.localeCompare(b,"ja"));
  select.innerHTML = '<option value="all">東京全体</option>';
  areas.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    select.appendChild(opt);
  });
  select.value = current === "all" || areas.includes(current) ? current : "all";
}

function applySearch(){
  const area = document.getElementById("areaMode").value;
  const kw = document.getElementById("keyword").value.toLowerCase().trim();
  filteredStores = stores.filter(s => {
    const text = [s.id,s.name,s.type,s.cityArea,s.address,(s.tags||[]).join("|"),s.memo].join(" ").toLowerCase();
    return (area === "all" || s.cityArea === area) && (!kw || text.includes(kw));
  });
  renderResults();
  renderMarkers();
  showResults();
  setStatus(filteredStores.length + "件表示 / 全" + stores.length + "件");
}

function renderResults(){
  const box = document.getElementById("resultsBox");
  if(!filteredStores.length){
    box.innerHTML = '<p class="small">該当なし。エリアを東京全体にしてください。</p>';
    return;
  }
  box.innerHTML = filteredStores.map((s,i) => `
    <div class="shop">
      <h3>${i+1}. ${esc(s.name)}</h3>
      <p>${esc(s.address)}</p>
      <p><span class="tag">${esc(s.cityArea)}</span><span class="tag">${esc(s.type)}</span>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</p>
      <div class="btns">
        <button class="secondary" onclick="focusStore('${escAttr(s.id)}')">地図で見る</button>
        <button onclick="openGoogle('${escAttr(s.id)}')">Googleマップ</button>
      </div>
    </div>
  `).join("");
}

function validCoord(s){
  const lat = Number(s.lat);
  const lng = Number(s.lng);
  return Number.isFinite(lat) && Number.isFinite(lng) && lat >= 20 && lat <= 46 && lng >= 122 && lng <= 154;
}

function renderMarkers(){
  markers.forEach(m => m.remove());
  markers = [];
  const list = filteredStores.filter(validCoord);
  if(!list.length) return;
  const bounds = [];
  list.forEach(s => {
    const marker = L.marker([Number(s.lat),Number(s.lng)]).addTo(map);
    marker.storeId = s.id;
    marker.bindPopup("<b>" + esc(s.name) + "</b><br>" + esc(s.address));
    markers.push(marker);
    bounds.push([Number(s.lat),Number(s.lng)]);
  });
  if(bounds.length === 1) map.setView(bounds[0], 15);
  else map.fitBounds(bounds, {padding:[30,30], maxZoom:14});
  setTimeout(()=>map.invalidateSize(),100);
}

function focusStore(id){
  const s = stores.find(x => x.id === id);
  if(!s || !validCoord(s)) return;
  map.setView([Number(s.lat),Number(s.lng)], 16);
  const m = markers.find(x => x.storeId === id);
  if(m) m.openPopup();
}

function openGoogle(id){
  const s = stores.find(x => x.id === id);
  if(!s) return;
  window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.name + " " + s.address), "_blank");
}

function exportCsv(){
  const header = "id,name,area,address,lat,lng,tags";
  const rows = stores.map(s => [
    s.id,
    s.name,
    s.cityArea,
    s.address,
    s.lat,
    s.lng,
    (s.tags||[]).join("|")
  ].map(csvEscape).join(","));
  const csv = header + "\n" + rows.join("\n");
  document.getElementById("csvInput").value = csv;
  document.getElementById("jsonBox").value = JSON.stringify(stores,null,2);
}

function csvEscape(v){
  const s = String(v ?? "");
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function resetStores(){
  localStorage.removeItem(STORAGE_KEY);
  stores = DEFAULT_STORES;
  exportCsv();
  buildAreas();
  applySearch();
}

function showData(){
  document.getElementById("dataBox").style.display = "block";
  document.getElementById("resultsBox").style.display = "none";
}

function showResults(){
  document.getElementById("dataBox").style.display = "none";
  document.getElementById("resultsBox").style.display = "grid";
}

function setStatus(t){document.getElementById("status").textContent = t;}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escAttr(s){return String(s??"").replace(/[\\'"<>]/g,"");}

window.addEventListener("load", init);
</script>

</body>
